# MICRODINE — Template Nginx (T-056)
#
# Reverse-proxy untuk aplikasi Laravel (PHP-FPM) + endpoint WebSocket Laravel
# Reverb. Salin ke /etc/nginx/sites-available/microdine.conf lalu buat symlink
# ke sites-enabled, sesuaikan domain/path/versi PHP-FPM sebelum dipakai.
#
# Lihat ARCHITECTURE.md Bab 12.2.

server {
    listen 80;
    listen [::]:80;
    server_name microdine.test;  # GANTI: domain/IP server produksi

    root /var/www/microdine/public;  # GANTI: path instalasi di server
    index index.php;

    client_max_body_size 20M;
    charset utf-8;

    access_log /var/log/nginx/microdine-access.log;
    error_log  /var/log/nginx/microdine-error.log;

    # --- Aplikasi utama (Inertia/Laravel) ---------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # GANTI: sesuaikan versi PHP-FPM terpasang
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- WebSocket Laravel Reverb (Modul G) -------------------------------
    # `php artisan reverb:start` default-nya mendengarkan di 127.0.0.1:8080
    # (lihat REVERB_HOST/REVERB_PORT di .env). Proxy ini membuatnya bisa
    # diakses lewat domain yang sama di path /app, dengan TLS (wss://)
    # ditangani oleh Nginx, bukan oleh Reverb sendiri.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Koneksi WebSocket perlu bertahan lama, jangan di-timeout seperti
        # request HTTP biasa.
        proxy_read_timeout 60s;
    }
}

# Catatan HTTPS (produksi sungguhan, bukan demo lomba):
# Tambahkan blok `server { listen 443 ssl; ... }` dengan sertifikat TLS
# (mis. Let's Encrypt/Certbot), set REVERB_SCHEME=https & VITE_REVERB_SCHEME=https
# di .env, lalu redirect blok :80 di atas ke https.
