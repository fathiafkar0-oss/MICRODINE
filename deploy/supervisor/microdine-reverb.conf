; MICRODINE — Supervisor: daemon Laravel Reverb (T-056)
;
; Menjaga `php artisan reverb:start` tetap menyala dan otomatis dihidupkan
; ulang (auto-recovery) jika proses mati/crash — tanpa ini, layar dapur/kasir
; berhenti ter-update otomatis begitu proses Reverb terhenti.
;
; Salin ke /etc/supervisor/conf.d/microdine-reverb.conf, sesuaikan path &
; user, lalu jalankan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start microdine-reverb
;
; .env server HARUS berisi BROADCAST_CONNECTION=reverb (bukan `log`) dan
; REVERB_HOST/REVERB_PORT sesuai apa yang diproksi Nginx (lihat
; deploy/nginx/microdine.conf, lokasi /app/).

[program:microdine-reverb]
process_name=%(program_name)s
command=php /var/www/microdine/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/microdine
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/microdine/storage/logs/supervisor-reverb.log
stopwaitsecs=30
