; MICRODINE — Supervisor: queue worker (T-056)
;
; Salin ke /etc/supervisor/conf.d/microdine-worker.conf, sesuaikan path &
; user, lalu jalankan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start microdine-worker:*
;
; Catatan: QUEUE_CONNECTION di .env proyek ini memakai `sync` (job jalan
; langsung di request, tanpa antrean) — lihat .env.example & AGENTS.md Bab 5
; (broadcast event memakai ShouldBroadcastNow, bukan job antrean). Worker ini
; tetap disiapkan agar siap pakai kalau QUEUE_CONNECTION diganti ke
; `database`/`redis` di produksi sungguhan (mis. untuk job notifikasi/email
; di masa depan) tanpa perlu konfigurasi Supervisor baru — selagi
; QUEUE_CONNECTION=sync, proses ini idle/no-op dan aman dibiarkan menyala.

[program:microdine-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/microdine/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/microdine
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/microdine/storage/logs/supervisor-worker.log
stopwaitsecs=3600
